# Kubernetes deployment for frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cords-frontend
  namespace: cords
  labels:
    app: cords-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cords-frontend
  template:
    metadata:
      labels:
        app: cords-frontend
    spec:
      containers:
        - name: cords-frontend
          image: us-central1-docker.pkg.dev/PROJECT_ID/cords-repo/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REACT_APP_API_URL
              value: "https://api.cords.example.com"
            - name: REACT_APP_MAPBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cords-secrets
                  key: mapbox-token
            - name: REACT_APP_STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: cords-secrets
                  key: stripe-public-key
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cords-frontend
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: cords-frontend-service
  namespace: cords
  labels:
    app: cords-frontend
spec:
  type: LoadBalancer
  selector:
    app: cords-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cords-frontend-hpa
  namespace: cords
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cords-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
