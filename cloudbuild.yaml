steps:
  # ── Build images in parallel ───────────────────────────────────────────────

  - name: 'gcr.io/cloud-builders/docker'
    id: build-backend
    args:
      - build
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/backend:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    args:
      - build
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/frontend:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - './frontend'

  # ── Push images in parallel ────────────────────────────────────────────────

  - name: 'gcr.io/cloud-builders/docker'
    id: push-backend
    waitFor: ['build-backend']
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    waitFor: ['build-frontend']
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/frontend']

  # ── Deploy backend then frontend (sequential — frontend needs backend URL) ──

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    waitFor: ['push-backend', 'push-frontend']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        REGION=us-central1
        REGISTRY=us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo
        CLOUDSQL_CONN=$PROJECT_ID:$REGION:cords-postgres

        echo "==> Deploying backend..."
        gcloud run deploy cords-backend \
          --image=$REGISTRY/backend:$SHORT_SHA \
          --region=$REGION \
          --platform=managed \
          --memory=512Mi --cpu=1 \
          --min-instances=0 --max-instances=10 \
          --timeout=60 --concurrency=100 \
          --set-cloudsql-instances=$CLOUDSQL_CONN \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,PORT=8080,\
        DB_HOST=/cloudsql/$CLOUDSQL_CONN,DB_PORT=5432,DB_NAME=cords_db,DB_USER=postgres,\
        SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_SECURE=false" \
          --update-secrets="\
        DB_PASSWORD=db-password:latest,\
        JWT_SECRET=jwt-secret:latest,\
        STRIPE_SECRET_KEY=stripe-secret:latest,\
        STRIPE_PUBLISHABLE_KEY=stripe-publishable-key:latest,\
        STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,\
        SMTP_USER=smtp-user:latest,\
        SMTP_PASS=smtp-pass:latest,\
        SMTP_FROM=smtp-from:latest"

        BACKEND_URL=$(gcloud run services describe cords-backend \
          --region=$REGION --format='value(status.url)')
        echo "Backend: $BACKEND_URL"

        echo "==> Deploying frontend..."
        gcloud run deploy cords-frontend \
          --image=$REGISTRY/frontend:$SHORT_SHA \
          --region=$REGION \
          --platform=managed \
          --memory=256Mi --cpu=1 \
          --min-instances=0 --max-instances=5 \
          --timeout=30 \
          --allow-unauthenticated \
          --set-env-vars="BACKEND_URL=$BACKEND_URL"

        FRONTEND_URL=$(gcloud run services describe cords-frontend \
          --region=$REGION --format='value(status.url)')

        echo "========================================"
        echo "Deployment complete"
        echo "Frontend : $FRONTEND_URL"
        echo "Backend  : $BACKEND_URL"
        echo "Webhook  : $BACKEND_URL/api/payments/webhook"
        echo "========================================"

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/backend:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/backend:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/frontend:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cords-repo/frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
