user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 8080;
        server_name _;

        # Google public DNS — required so nginx can resolve the backend Cloud Run
        # hostname at request time when proxy_pass uses a variable.
        resolver 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        root  /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options       "SAMEORIGIN"                        always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header X-XSS-Protection      "1; mode=block"                     always;
        add_header Referrer-Policy       "strict-origin-when-cross-origin"   always;

        # Static assets — CRA filenames already include a content hash
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Proxy all /api/* calls to the backend Cloud Run service.
        # BACKEND_URL is substituted by entrypoint.sh at container start, e.g.:
        #   https://cords-backend-xxxx-uc.a.run.app
        location /api/ {
            set $backend "__BACKEND_URL__";
            proxy_pass            $backend/api/;
            proxy_ssl_server_name on;
            proxy_ssl_protocols   TLSv1.2 TLSv1.3;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        '';
            proxy_set_header Host              $proxy_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # SPA — let React Router handle client-side routes
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Health check (Cloud Run uses this to know the container is ready)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Block dot-files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
